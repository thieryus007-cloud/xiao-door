# Ouvre la fenêtre de commissioning BLE automatiquement au boot si l'appareil
# n'est pas encore commissionné, au lieu d'exiger un appui bouton.
#
# CHIP_ENABLE_PAIRING_AUTOSTART vaut "n" par défaut dans le Kconfig nRF
# Connect SDK (config/zephyr/Kconfig) — contrairement au défaut de la lib
# CHIP amont (CHIP_DEVICE_CONFIG_ENABLE_PAIRING_AUTOSTART=1). C'est un choix
# de conception Nordic (économie d'énergie), pas un bug : sans ce flag, il
# faut appuyer sur le bouton BLE (BLUETOOTH_ADV_BUTTON, voir board_config.h)
# pour déclencher StartBLEAdvertisement() -> OpenBasicCommissioningWindow().
#
# Sur cette board custom, un seul bouton physique existe (button0, voir
# xiao_nrf54lm20a_nrf54lm20a-common.dtsi) et FUNCTION_BUTTON/BLUETOOTH_ADV_BUTTON
# y sont tous les deux mappés (board_config.h) — donc un appui court dessus
# devrait aussi fonctionner. Ce flag est un confort pour ne pas dépendre
# de cette manipulation physique lors du commissioning des ~20 unités.
#
# Usage : -DEXTRA_CONF_FILE=firmware/apps/lock/pairing-autostart.conf
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y
