# This sample uses Kconfig.defaults to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Enable CHIP
CONFIG_CHIP=y
CONFIG_CHIP_PROJECT_CONFIG="src/chip_project_config.h"
CONFIG_CHIP_DEVICE_PRODUCT_NAME="Matter Door Lock"

# Configure ZAP file name
CONFIG_NCS_SAMPLE_MATTER_ZAP_FILE_PATH="${APPLICATION_CONFIG_DIR}/src/default_zap/lock.zap"

# 32774 == 0x8006 (example lock-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32774
CONFIG_STD_CPP17=y

# Enable Matter extended announcement and increase duration to 1 hour.
CONFIG_CHIP_BLE_EXT_ADVERTISING=y
CONFIG_CHIP_BLE_ADVERTISING_DURATION=60

# Add support for LEDs and buttons on Nordic development kits
CONFIG_DK_LIBRARY=y

# Bluetooth Low Energy configuration
CONFIG_BT_DEVICE_NAME="MatterLock"

# Suspend devices when the CPU goes into sleep
CONFIG_PM_DEVICE=y

# Other settings
CONFIG_THREAD_NAME=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_RESET_ON_FATAL_ERROR=n
CONFIG_CHIP_LIB_SHELL=y
CONFIG_NCS_SAMPLE_MATTER_TEST_SHELL=y

# Reduce application size
CONFIG_USE_SEGGER_RTT=n
CONFIG_MATTER_LOG_LEVEL_INF=y
CONFIG_CHIP_APP_LOG_LEVEL=3

# Enable Factory Data feature
CONFIG_CHIP_FACTORY_DATA=y
CONFIG_CHIP_FACTORY_DATA_BUILD=y

# Ouvre la fenêtre de commissioning BLE automatiquement au boot si l'appareil
# n'est pas encore commissionné (CHIP_ENABLE_PAIRING_AUTOSTART vaut "n" par
# défaut dans le Kconfig nRF Connect SDK, choix de conception Nordic pour
# l'économie d'énergie, pas un bug — voir KNOWN-ISSUES.md). Fusionné ici
# depuis l'ancien pairing-autostart.conf maintenant que l'app est forkée
# dans le repo.
CONFIG_CHIP_ENABLE_PAIRING_AUTOSTART=y

# IMU LSM6DS3TR-C (Priorité 2) — lecture 6 axes en polling (imu_manager.cpp).
# CONFIG_REGULATOR active le driver nPM1300 dont dépend le "regulator-boot-on"
# du régulateur imu_vdd (voir boards/....overlay -- nécessaire pour que le
# capteur soit déjà alimenté quand son propre driver s'initialise au boot).
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_REGULATOR=y

# ODR par défaut à la valeur "runtime" (0) laisserait le capteur en power-down
# tant que l'appli n'appelle pas explicitement sensor_attr_set() -- on préfère
# une fréquence fixe configurée par le driver lui-même dès le boot (index 2 =
# 26 Hz, largement suffisant pour un polling applicatif toutes les 2s).
CONFIG_LSM6DSL_ACCEL_ODR=2
CONFIG_LSM6DSL_GYRO_ODR=2
