# Fragment de debug — active les logs via Segger RTT (lisible par OpenOCD
# sur la sonde CMSIS-DAP intégrée, sans matériel supplémentaire).
# Usage : -DEXTRA_CONF_FILE=firmware/apps/lock/debug-rtt.conf
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_BOOT_BANNER=y
CONFIG_LOG_DEFAULT_LEVEL=4
