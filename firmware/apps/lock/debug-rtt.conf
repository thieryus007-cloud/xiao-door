# Fragment de debug — active les logs via Segger RTT (lisible par OpenOCD
# sur la sonde CMSIS-DAP intégrée, sans matériel supplémentaire).
# Usage : -DEXTRA_CONF_FILE=firmware/apps/lock/debug-rtt.conf
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
# Désactivé pour garder le CPU/RAM éveillés pendant le débogage —
# la gestion d'énergie semble faire perdre la session RTT/SWD.
CONFIG_PM_DEVICE=n
CONFIG_PM=n
