# Fragment de diagnostic — force la publicité BLE classique (legacy)
# au lieu de l'extended advertising (activé par défaut dans le sample),
# pour vérifier avec un scanner BLE générique si l'appareil émet bien.
# Usage : -DEXTRA_CONF_FILE=firmware/apps/lock/legacy-ble.conf
CONFIG_CHIP_BLE_EXT_ADVERTISING=n
CONFIG_CHIP_BLE_ADVERTISING_DURATION=15
