# Etape 2 (2026-08-27) -- base System OFF validee (test #13, 3,02 uA) +
# GRTC + RAM retenue + BLE/BTHome (trame B sante/batterie uniquement).
# Pas d'IMU dans ce test.
# Serial desactive en dur (pas suspendu a l'execution) -- meme approche
# que la production, meme cause : bug driver UARTE (fuite de reference PM
# runtime, retour DevZone Nordic) qui fait echouer la suspension a
# l'execution (pm_device_action_run -120 systematique, confirme sur ce
# build avec BLE actif) et laisse le serial actif en System OFF. Le
# test #13 (sans BLE) s'en sortait avec la suspension a l'execution --
# echoue ici. Sans backend console, les printf() restants dans main.c
# n'ecrivent simplement plus nulle part (pas d'erreur, juste silencieux).
# Console reactivee temporairement le 2026-08-27 pour lire LDSWCONFIG
# (registre confirme a 0x00 = valeur de reset, piste ecartee). Repassee
# en dur a n ici -- regle absolue, voir prj.conf plus haut dans
# l'historique et XIAO-nRF54LM20A-Solution-System-OFF.md.
# CONFIG_BOOT_BANNER=n seul ne suffit PAS : CONFIG_NCS_BOOT_BANNER (SDK
# Nordic, nrf/lib/boot_banner/Kconfig, "default y") est un symbole
# SEPARE qui fait "select PRINTK" + "select EARLY_CONSOLE" -- c'est lui
# qui imprime "Booting nRF Connect SDK vX.X.X". Sans cette ligne,
# CONFIG_PRINTK repassait a y malgre CONFIG_PRINTK=n explicite
# ci-dessous (trouve via zephyr/.config-trace.json, 2026-08-27). Sans
# backend console/serial, ceci reste sans impact materiel (aucun
# peripherique UARTE lie), mais les deux symboles de banniere doivent
# etre desactives ensemble (pratique officielle NCS, voir
# nrf/tests/subsys/west_debug/prj.conf).
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_POWEROFF=y
CONFIG_HWINFO=y

# Bluetooth : broadcaster seul (advertising, pas de connexion), trame B
# uniquement (sante/batterie).
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="XIAO-DOOR"

# RAM retenue (packet_id, echeances GRTC) -- CONFIG_RETAINED_MEM_NRF_RAM_CTRL
# se selectionne automatiquement une fois le noeud "zephyr,retained-ram" +
# CONFIG_POWEROFF presents.
CONFIG_RETAINED_MEM=y
CONFIG_CRC=y

# Batterie via le PMIC nPM1300 (trame B)
CONFIG_SENSOR=y
CONFIG_NPM13XX_CHARGER=y
CONFIG_MFD=y

CONFIG_REGULATOR=y

# Test #16 (2026-08-27) -- alignement sur l'exemple officiel Seeed
# (imu_click) : driver LSM6DSL avec interruption reellement servie
# (au lieu de TRIGGER_NONE), init differee via zephyr,deferred-init
# (voir overlay) declenchee explicitement dans main.c.
CONFIG_I2C=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_TRIGGER_GLOBAL_THREAD=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# sys_reboot() -- si bt_enable() echoue au boot
CONFIG_REBOOT=y
