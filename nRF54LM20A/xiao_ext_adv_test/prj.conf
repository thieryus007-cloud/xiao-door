# Banc de test BLE Extended Advertising -- Evolution-XIAO-BLE.md §6
# Basé sur xiao_door_sensor (identité BLE fixe, IMU, batterie), profil E :
# une seule trame étendue au lieu de 3 trames legacy.

CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="SANT-E1"

# --- Publicité étendue (§6.4) ---
CONFIG_BT_EXT_ADV=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=1
CONFIG_BT_CTLR_ADV_EXT=y
CONFIG_BT_CTLR_ADV_DATA_LEN_MAX=255

# Identité BLE fixe (hwinfo) -- set_fixed_ble_identity() dans main.c
CONFIG_HWINFO=y

# IMU (LSM6DS3TR-C sur I2C, derrière la LDO1 du nPM1300)
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ENABLE_TEMP=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_REGULATOR=y

# Tension batterie via le front-end charger du nPM1300
CONFIG_NPM13XX_CHARGER=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_CBPRINTF_COMPLETE=y

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
