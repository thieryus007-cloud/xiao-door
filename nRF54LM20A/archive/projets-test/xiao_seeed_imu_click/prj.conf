# Reproduction stricte de l'exemple officiel Seeed (imu_click),
# wiki.seeedstudio.com/xiao_nrf54lm20a_with_onboard/ -- config copiee
# verbatim depuis la page (2026-08-27), avec LOG/console actives pour
# la verification fonctionnelle initiale (a desactiver avant mesure
# PPK2 -- voir la regle absolue CONFIG_SERIAL du projet).

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_REGULATOR=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Test #20 -- petit levier, sans effet mesurable seul (voir
# Test-Seeed-imu_click-Optimisations.md) mais conserve. Fausse piste
# ecartee (2026-08-27) : retire temporairement pour diagnostiquer une
# apparente absence de sortie serie au boot du test #21 -- sans effet,
# la vraie cause etait le Debug Interface Mode (boucle de redemarrage
# trop rapide pour le mode de log differe), pas PM_DEVICE_RUNTIME.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Test #21 (2026-08-27) -- vrai System OFF : plus besoin du thread de
# declenchement du driver LSM6DSL (CONFIG_LSM6DSL_TRIGGER_GLOBAL_THREAD
# retire, TRIGGER_NONE par defaut) -- l'armement du reveil GPIO se fait
# nous-memes directement sur la broche INT1 (voir main.c), et le SoC
# redemarre entierement au reveil : plus besoin que le driver gere sa
# propre interruption en continu.
CONFIG_POWEROFF=y
CONFIG_HWINFO=y

# Verification fonctionnelle OK (2026-08-27, mode log immediat) :
# enable_imu_power ret=0, device_init ret=0, "IMU device ready", "Tap
# detection configured on IMU hardware", "Entering System OFF". Boucle
# de redemarrage observee ensuite = Debug Interface Mode (USB-C encore
# branche), pas un bug -- necessite une vraie coupure d'alimentation
# avant mesure. Console desactivee en dur pour la mesure PPK2 propre.
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_LOG=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n
