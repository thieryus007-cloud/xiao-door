# Audit-Consommation-2026-09-13.md, §6 -- firmware de diagnostic pur,
# aucune fonctionnalite de production. Silencieux (mesure PPK2 uniquement,
# meme regle que le reste du projet -- voir CLAUDE.md).
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_NCS_BOOT_BANNER=n

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_MFD_NPM13XX=y
CONFIG_REGULATOR=y

# Hypothese #1 (2026-09-13, ppk-20260913T175827.csv) : PM_DEVICE_RUNTIME
# absent. INFIRMEE par la mesure suivante (ppk-20260913T181221.csv,
# baseline inchangee ~20 uA apres ajout de ces deux lignes) -- gardees
# actives (comportement de reference correct) mais ne sont pas la cause.
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Hypothese #2, testee ici : la flash SPI externe (py25q64) n'est jamais
# touchee par ce firmware de diagnostic (status="disabled" par defaut
# dans le dtsi de base du board, jamais active dans l'overlay comme le
# fait la production) -- ni mise en deep-power-down par son driver
# (PM_DEVICE_ACTION_SUSPEND), ni ses broches forcees a un etat
# deterministe (configure_spi_pins_for_system_off(), voir main.c). La
# production fait explicitement les deux avant toute mesure -- jamais
# reproduit ici jusqu'a present.
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y

CONFIG_MAIN_STACK_SIZE=2048
