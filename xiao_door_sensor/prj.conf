# Bluetooth: broadcaster-only (advertising, no connections/pairing needed
# for BTHome-style passive sensor broadcast)
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_DEVICE_NAME="XIAO-DOOR"

# Unique, stable (not re-randomized per boot) BLE identity derived from the
# chip's hardware ID -- see set_fixed_ble_identity() in main.c
CONFIG_HWINFO=y

# IMU (LSM6DS3TR-C over I2C, behind the nPM1300 PMIC LDO1 rail)
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y
CONFIG_LSM6DSL_ENABLE_TEMP=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_MFD=y
CONFIG_REGULATOR=y

# Battery voltage via the nPM1300 charger front-end
CONFIG_NPM13XX_CHARGER=y

# Logging désactivé définitivement, en production comme pour la mesure
# PPK2 (2026-08-27) : un retour DevZone Nordic documente un courant
# anormalement élevé en sleep/System OFF causé par l'UART/logging resté
# actif, pas par un vrai défaut matériel (voir PPK-Mesures-Transition.md
# § Retours communautaires). CONFIG_LOG=n fait compiler tous les appels
# LOG_*() de main.c en no-op -- aucune modification du code source
# nécessaire. Ne pas réactiver (consigne explicite de l'utilisateur,
# 2026-08-27) -- voir § UART/CONFIG_SERIAL ci-dessous pour la piste de
# diagnostic retenue à la place.
# CONFIG_STDOUT_CONSOLE=y
# CONFIG_LOG=y
# CONFIG_LOG_BACKEND_UART=y
# CONFIG_LOG_DEFAULT_LEVEL=3
# CONFIG_CBPRINTF_FP_SUPPORT=y
# CONFIG_CBPRINTF_COMPLETE=y

# CONFIG_SERIAL/CONFIG_CONSOLE/CONFIG_UART_CONSOLE restaient à `y` dans le
# .config généré (2026-08-27) malgré CONFIG_LOG=n ci-dessus -- valeurs par
# défaut de la carte (nrf54lm20a_cpuapp_common.dtsi choisit uart20 comme
# zephyr,console), pas désactivées juste en retirant nos lignes de
# logging. Un fil DevZone Nordic confirme un bug driver UARTE (fuite de
# référence PM runtime) causant un courant de sommeil anormalement élevé
# sur cette même puce quand la console UART reste active, indépendamment
# de l'usage réel du logging applicatif. Désactivation explicite forcée
# ici pour éliminer cette piste :
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Réveil matériel + System OFF (Recherche-Reveil-Materiel-XIAO.md,
# 2026-08-23) : le SoC dort en System OFF entre les rafales BLE, réveillé
# soit par l'IMU (interruption INT1 sur seuil de mouvement), soit par le
# GRTC (échéances trame santé/heartbeat). CONFIG_RETAINED_MEM_NRF_RAM_CTRL
# se sélectionne automatiquement une fois le nœud devicetree
# "zephyr,retained-ram" + CONFIG_POWEROFF présents (drivers/retained_mem/
# Kconfig.nrf) -- rien d'autre à activer pour la rétention RAM elle-même.
CONFIG_POWEROFF=y
CONFIG_RETAINED_MEM=y
CONFIG_CRC=y

# sys_reboot() -- reboot automatique si init_imu()/bt_enable() échoue au
# boot, au lieu de rester bloqué silencieusement sans source de réveil
# armée (voir main.c, 2026-08-24).
CONFIG_REBOOT=y
